name: Pause prod 19:00 reminders

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pause:
    name: Pause 19:00 reminder times
    runs-on: ubuntu-latest
    environment: deploy-prod
    env:
      PROD_AI_SERVER_HOST: ${{ secrets.PROD_AI_SERVER_HOST }}
      PROD_AI_SERVER_USER: ${{ secrets.PROD_AI_SERVER_USER }}
      PROD_AI_SERVER_SSH_KEY: ${{ secrets.PROD_AI_SERVER_SSH_KEY }}
    steps:
      - name: Mark today's 19:00 broadcast already sent
        run: |
          set -euo pipefail
          : "${PROD_AI_SERVER_HOST:?}"
          : "${PROD_AI_SERVER_USER:?}"
          : "${PROD_AI_SERVER_SSH_KEY:?}"
          KEY="$RUNNER_TEMP/vps_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$PROD_AI_SERVER_SSH_KEY" > "$KEY"
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          ssh "${SSH_OPTS[@]}" "${PROD_AI_SERVER_USER}@${PROD_AI_SERVER_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker inspect redis >/dev/null
          TODAY=$(TZ=Europe/Moscow date +%F)
          echo "moscow_day=$TODAY"
          docker exec -i redis redis-cli EVAL "$(cat <<'LUA'
          local function is_telegram(session)
            return string.match(session, "^tg%-ChatId%(chatId=%-?%d+%)$") ~= nil
              or string.match(session, "^tg%-%-?%d+$") ~= nil
          end

          local today = ARGV[1]
          local known = {}
          local cursor = "0"
          repeat
            local res = redis.call("SCAN", cursor, "MATCH", "metrics:funnel:user:tg-*", "COUNT", 500)
            cursor = res[1]
            for _, key in ipairs(res[2]) do
              local session = string.sub(key, #"metrics:funnel:user:" + 1)
              if is_telegram(session) then
                known[session] = true
              end
            end
          until cursor == "0"

          local chats = redis.call("ZRANGE", "metrics:chats", 0, -1)
          for _, session in ipairs(chats) do
            if is_telegram(session) then
              known[session] = true
            end
          end

          local eligible = 0
          local marked = 0
          local already = 0
          local active = 0
          for session, _ in pairs(known) do
            if redis.call("SISMEMBER", "metrics:dau:" .. today, session) == 1 then
              active = active + 1
            else
              eligible = eligible + 1
              local key = "reminder:sent:" .. today .. ":" .. session
              if redis.call("EXISTS", key) == 1 then
                already = already + 1
              else
                redis.call("SET", key, "1", "EX", "172800")
                marked = marked + 1
              end
            end
          end
          return "eligible=" .. eligible .. " marked=" .. marked .. " already=" .. already .. " active=" .. active .. " chats=" .. #chats
          LUA
          )" 0 "$TODAY"
          REMOTE
