name: Install Speaky release

on:
  workflow_call:
    inputs:
      destination:
        type: string
        required: true
      release_run_id:
        type: string
        required: true
      components:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: deploy-dev-release
    env:
      DESTINATION: ${{ inputs.destination }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      COMPONENTS: ${{ inputs.components }}
    steps:
      - name: Check the approved workflow ref and activation
        env:
          RELEASE_ENABLED: ${{ vars.SPEAKY_RELEASE_ENABLED }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          case "$DESTINATION:$GITHUB_WORKFLOW" in
            "dev:Redeploy DEV (release ID)") ;;
            *) echo 'Unexpected deployment caller' >&2; exit 1 ;;
          esac
          test "$RELEASE_ENABLED" = true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download and verify the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 infra/release/release.py fetch "$GITHUB_REPOSITORY" "$DESTINATION" \
            "$RELEASE_RUN_ID" "$COMPONENTS" "$RUNNER_TEMP/release"
      - name: Stage, activate and verify selected components
        env:
          SPEAKY_RELEASE_ENABLED: ${{ vars.SPEAKY_RELEASE_ENABLED }}
          SPEAKY_RELEASE_RUNTIME_FAMILY: ${{ vars.SPEAKY_RELEASE_RUNTIME_FAMILY }}
          SPEAKY_RELEASE_MINIAPP_URL: ${{ vars.SPEAKY_RELEASE_MINIAPP_URL }}
          SPEAKY_RELEASE_KNOWN_HOSTS: ${{ secrets.SPEAKY_RELEASE_KNOWN_HOSTS }}
          SPEAKY_RELEASE_KTOR_HOST: ${{ secrets.SPEAKY_RELEASE_KTOR_HOST }}
          SPEAKY_RELEASE_KTOR_USER: ${{ secrets.SPEAKY_RELEASE_KTOR_USER }}
          SPEAKY_RELEASE_KTOR_SSH_KEY: ${{ secrets.SPEAKY_RELEASE_KTOR_SSH_KEY }}
          SPEAKY_RELEASE_AI_HOST: ${{ secrets.SPEAKY_RELEASE_AI_HOST }}
          SPEAKY_RELEASE_AI_USER: ${{ secrets.SPEAKY_RELEASE_AI_USER }}
          SPEAKY_RELEASE_AI_SSH_KEY: ${{ secrets.SPEAKY_RELEASE_AI_SSH_KEY }}
        run: python3 infra/release/rollout.py "$DESTINATION" "$COMPONENTS" "$RUNNER_TEMP/release"
      - name: Publish rollout summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release/rollout.json" ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/release/rollout.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish DEV promotion receipt
        if: inputs.destination == 'dev'
        uses: actions/upload-artifact@v6
        with:
          name: speaky-dev-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/receipt.json
          if-no-files-found: error
          retention-days: 30
