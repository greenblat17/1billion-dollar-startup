name: Redeploy DEV

on:
  workflow_dispatch:
    inputs:
      cmp_server:
        description: cmp-server
        type: boolean
        default: true
      ai_server:
        description: ai-server
        type: boolean
        default: true
      mini_app:
        description: mini-app frontend
        type: boolean
        default: true
      billing_mock:
        description: Enable SP-05 mock billing on DEV (100 TEST per day, no real charges)
        type: boolean
        default: false
      verify_only:
        description: Read-only DEV readiness without redeployment
        type: boolean
        default: false
      tutor_smoke:
        description: Two synthetic tutor requests after DEV readiness (stop on first failure)
        type: boolean
        default: false
      speech_time_benchmark:
        description: Measure speech time on DEV AI without redeploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  require-target:
    name: Require a host
    runs-on: ubuntu-latest
    steps:
      - name: Fail if both hosts off
        if: ${{ inputs.cmp_server != true && inputs.ai_server != true && inputs.mini_app != true && inputs.speech_time_benchmark != true && !inputs.verify_only }}
        run: |
          echo "Enable cmp-server, ai-server or mini-app" >&2
          exit 1

  package-server:
    name: Package cmp-server
    needs: require-target
    if: ${{ inputs.cmp_server && !inputs.speech_time_benchmark && !inputs.verify_only }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CMP
        uses: ./.github/actions/setup-cmp

      - name: Test
        run: ./gradlew :server:test

      - name: Package
        run: ./gradlew :server:buildFatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: server-all
          path: cmp/server/build/libs/server-all.jar
          if-no-files-found: error
          retention-days: 1

  package-ai:
    name: Package ai-server
    needs: require-target
    if: ${{ inputs.ai_server && !inputs.speech_time_benchmark && !inputs.verify_only }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Stage runtime
        run: |
          STAGE="$RUNNER_TEMP/ai-service-runtime"
          mkdir -p "$STAGE"
          cp Dockerfile requirements.txt "$STAGE/"
          cp -R app "$STAGE/app"

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: ai-service
          path: ${{ runner.temp }}/ai-service-runtime
          if-no-files-found: error
          retention-days: 1

  deploy-mini-app:
    name: Deploy Mini App
    needs: require-target
    if: ${{ inputs.mini_app && !inputs.speech_time_benchmark && !inputs.verify_only }}
    uses: ./.github/workflows/deploy-mini-app.yml
    secrets: inherit

  deploy-server:
    name: Deploy cmp-server
    needs:
      - require-target
      - package-server
    if: ${{ !cancelled() && inputs.cmp_server && !inputs.speech_time_benchmark && !inputs.verify_only && needs.package-server.result == 'success' }}
    uses: ./.github/workflows/deploy-cmp-server.yml
    with:
      destination: dev
      billing_mock: ${{ inputs.billing_mock }}
    secrets: inherit

  deploy-ai:
    name: Deploy ai-server
    needs:
      - require-target
      - package-ai
      - deploy-mini-app
    if: ${{ !cancelled() && inputs.ai_server && !inputs.speech_time_benchmark && !inputs.verify_only && needs.package-ai.result == 'success' && (!inputs.mini_app || needs.deploy-mini-app.result == 'success') }}
    uses: ./.github/workflows/deploy-ai-server.yml
    with:
      destination: dev
    secrets: inherit

  speech-time-benchmark:
    name: Benchmark speech time on DEV AI
    needs: require-target
    if: ${{ inputs.speech_time_benchmark }}
    runs-on: ubuntu-latest
    environment: deploy-dev
    concurrency:
      group: ai-dev-benchmark
      cancel-in-progress: false
    env:
      DEV_AI_SERVER_HOST: ${{ secrets.DEV_AI_SERVER_HOST }}
      DEV_AI_SERVER_USER: ${{ secrets.DEV_AI_SERVER_USER }}
      DEV_AI_SERVER_SSH_KEY: ${{ secrets.DEV_AI_SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Measure with real DEV STT in a temporary container
        shell: bash
        run: |
          set -euo pipefail
          : "${DEV_AI_SERVER_HOST:?}"
          : "${DEV_AI_SERVER_USER:?}"
          : "${DEV_AI_SERVER_SSH_KEY:?}"
          archive="$RUNNER_TEMP/speech-time-benchmark.tgz"
          tar -czf "$archive" ai-service/app load/speech-time-dev-benchmark.py load/fixtures/librispeech-test-clean
          key="$RUNNER_TEMP/dev-ai-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEV_AI_SERVER_SSH_KEY" > "$key"
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          remote_archive="/tmp/speech-time-benchmark-${GITHUB_RUN_ID}.tgz"
          scp "${opts[@]}" "$archive" "${DEV_AI_SERVER_USER}@${DEV_AI_SERVER_HOST}:$remote_archive"
          ssh "${opts[@]}" "${DEV_AI_SERVER_USER}@${DEV_AI_SERVER_HOST}" \
            "BENCH_RUN_ID=$GITHUB_RUN_ID bash -s" <<'REMOTE'
          set -euo pipefail
          archive="/tmp/speech-time-benchmark-${BENCH_RUN_ID}.tgz"
          work=$(mktemp -d /tmp/speech-time-benchmark.XXXXXX)
          trap 'rm -rf "$work" "$archive"' EXIT
          tar -xzf "$archive" -C "$work"
          echo "DEV AI logical CPUs: $(nproc)"
          image=$(docker inspect --format '{{.Image}}' ai-service)
          docker run --rm --name "speech-time-benchmark-${BENCH_RUN_ID}" \
            --env-file /opt/ai-service/.env \
            -v "$work:/bench:ro" -w /bench -e PYTHONPATH=/bench/ai-service \
            "$image" sh -c \
            'pip install --quiet --no-cache-dir webrtcvad-wheels==2.0.14.post1 && python load/speech-time-dev-benchmark.py'
          REMOTE

  verify-tutor-dev:
    name: Verify DEV tutor readiness
    needs: [deploy-server, deploy-ai]
    if: ${{ !cancelled() && (inputs.verify_only || (needs.deploy-server.result == 'success' && needs.deploy-ai.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: deploy-dev
    env:
      CMP_HOST: ${{ secrets.DEV_CMP_SERVER_HOST }}
      CMP_USER: ${{ secrets.DEV_CMP_SERVER_USER }}
      CMP_KEY: ${{ secrets.DEV_CMP_SERVER_SSH_KEY }}
      AI_HOST: ${{ secrets.DEV_AI_SERVER_HOST }}
      AI_USER: ${{ secrets.DEV_AI_SERVER_USER }}
      AI_KEY: ${{ secrets.DEV_AI_SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify artifacts, health, configuration and internal auth
        shell: bash
        run: |
          set -euo pipefail
          smoke_flag=""
          billing_flag=""
          if [ "${{ inputs.billing_mock }}" = true ]; then billing_flag="--mock-billing"; fi
          for component in ai cmp; do
            if [ "$component" = ai ]; then
              target_host="$AI_HOST"; target_user="$AI_USER"; key_body="$AI_KEY"
            else
              target_host="$CMP_HOST"; target_user="$CMP_USER"; key_body="$CMP_KEY"
              if [ "${{ inputs.tutor_smoke }}" = true ]; then smoke_flag="--smoke"; fi
            fi
            key="$RUNNER_TEMP/verify-$component-key"
            install -m 600 /dev/null "$key"
            printf '%s\n' "$key_body" > "$key"
            ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o HostKeyAlias="speaky-dev-$component" -o UserKnownHostsFile="$GITHUB_WORKSPACE/infra/dev/known_hosts" \
              "$target_user@$target_host" "python3 - $component $GITHUB_SHA $smoke_flag $billing_flag" < infra/dev/verify-tutor.py
          done
