name: Redeploy DEV

on:
  workflow_dispatch:
    inputs:
      cmp_service:
        description: cmp-service
        type: boolean
        default: true
      telegram_service:
        description: telegram-service
        type: boolean
        default: true
      ai_service:
        description: ai-service
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  require-target:
    name: Require a host
    runs-on: ubuntu-latest
    steps:
      - name: Fail if every host is off
        if: ${{ inputs.cmp_service != true && inputs.telegram_service != true && inputs.ai_service != true }}
        run: |
          echo "Enable cmp-service, telegram-service, and/or ai-service" >&2
          exit 1

  package-cmp-service:
    name: Package cmp-service
    needs: require-target
    if: ${{ inputs.cmp_service }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CMP
        uses: ./.github/actions/setup-cmp

      - name: Test
        run: ./gradlew :service-common:test :cmp-service:test

      - name: Package
        run: ./gradlew :cmp-service:buildFatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: cmp-service-all
          path: cmp/cmp-service/build/libs/cmp-service-all.jar
          if-no-files-found: error
          retention-days: 1

  package-telegram-service:
    name: Package telegram-service
    needs: require-target
    if: ${{ inputs.telegram_service }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CMP
        uses: ./.github/actions/setup-cmp

      - name: Test
        run: ./gradlew :service-common:test :telegram-service:test

      - name: Package
        run: ./gradlew :telegram-service:buildFatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: telegram-service-all
          path: cmp/telegram-service/build/libs/telegram-service-all.jar
          if-no-files-found: error
          retention-days: 1

  package-ai:
    name: Package ai-service
    needs: require-target
    if: ${{ inputs.ai_service }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Stage runtime
        run: |
          STAGE="$RUNNER_TEMP/ai-service-runtime"
          mkdir -p "$STAGE"
          cp Dockerfile requirements.txt "$STAGE/"
          cp -R app "$STAGE/app"

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: ai-service
          path: ${{ runner.temp }}/ai-service-runtime
          if-no-files-found: error
          retention-days: 1

  deploy-cmp-service:
    name: Deploy cmp-service
    needs:
      - require-target
      - package-cmp-service
    if: ${{ !cancelled() && inputs.cmp_service && needs.package-cmp-service.result == 'success' }}
    uses: ./.github/workflows/deploy-cmp-service.yml
    secrets: inherit

  deploy-telegram-service:
    name: Deploy telegram-service
    needs:
      - require-target
      - package-telegram-service
    if: ${{ !cancelled() && inputs.telegram_service && needs.package-telegram-service.result == 'success' }}
    uses: ./.github/workflows/deploy-telegram-service.yml
    secrets: inherit

  deploy-ai:
    name: Deploy ai-service
    needs:
      - require-target
      - package-ai
    if: ${{ !cancelled() && inputs.ai_service && needs.package-ai.result == 'success' }}
    uses: ./.github/workflows/deploy-ai-server.yml
    with:
      destination: dev
    secrets: inherit
