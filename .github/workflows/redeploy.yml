name: Redeploy DEV

on:
  workflow_dispatch:
    inputs:
      cmp_server:
        description: cmp-server
        type: boolean
        default: true
      ai_server:
        description: ai-server
        type: boolean
        default: true
      mini_app:
        description: mini-app frontend
        type: boolean
        default: true
      billing_mock:
        description: Enable SP-05 mock billing on DEV (100 TEST per day, no real charges)
        type: boolean
        default: false
      agent_test:
        description: Enable the authenticated agent dialogue route on DEV
        type: boolean
        default: false
      agent_message:
        description: One synthetic learner turn on the deployed DEV Ktor host
        type: string
        default: ''
      agent_student_id:
        description: Existing agent-test student UUID (blank starts a dialogue)
        type: string
        default: ''
      foundation_check:
        description: Run a repo-owned Foundation scenario through DEV loopback
        type: boolean
        default: false
      foundation_scenario:
        description: Repo scenario file name (foundation-*.json)
        type: string
        default: foundation-read.json
      foundation_student_id:
        description: Existing agent-test UUID (blank creates a new synthetic student)
        type: string
        default: ''
      foundation_regular_entitlement:
        description: Grant bounded DEV-only regular entitlement to the given agent-test UUID
        type: boolean
        default: false
      agent_voice:
        description: Run a short synthetic voice lesson on deployed DEV services
        type: boolean
        default: false
      agent_voice_student_id:
        description: Existing agent-test student UUID for the voice lesson
        type: string
        default: ''
      agent_voice_lesson_id:
        description: Owned executable lesson UUID for the voice test
        type: string
        default: ''
      agent_voice_scenario:
        description: Synthetic voice scenario, read-only state, or audio preparation
        type: choice
        options:
          - short
          - early-exit
          - phase-probe
          - regular-action
          - regular-action-mute
          - regular-action-clear-finish
          - regular-action-controlled-input
          - read-only
          - dependencies-only
          - controlled-audio-only
        default: short
      agent_voice_audio_run_id:
        description: Optional dependencies-only workflow run containing verified voice WAV
        type: string
        default: ''
      verify_only:
        description: Read-only DEV readiness without redeployment
        type: boolean
        default: false
      tutor_smoke:
        description: Two synthetic tutor requests after DEV readiness (stop on first failure)
        type: boolean
        default: false
      diagnose_tutor:
        description: Print only safe AI tutor error codes from recent DEV logs
        type: boolean
        default: false
      diagnose_error_id:
        description: Optional exact 32-character AI error ID for safe correlation
        type: string
        default: ''
      diagnose_call_session_id:
        description: Optional call-session UUID for payload-free Realtime event correlation
        type: string
        default: ''
      diagnose_tutor_at:
        description: Optional UTC timestamp (YYYY-MM-DDTHH:MM:SSZ) for a 60-second Ktor tutor error scan
        type: string
        default: ''
      diagnose_foundation_job_id:
        description: Optional exact Foundation job UUID to inspect at diagnose_tutor_at on DEV
        type: string
        default: ''
      speech_time_benchmark:
        description: Measure speech time on DEV AI without redeploying
        type: boolean
        default: false
      catalog_release_config:
        description: Optional JSON with version, sha256, publish, reviewer, reviewReference for DEV catalog
        type: string
        default: ''

permissions:
  contents: read

jobs:
  require-target:
    name: Require a host
    runs-on: ubuntu-latest
    steps:
      - name: Fail if both hosts off
        if: ${{ inputs.cmp_server != true && inputs.ai_server != true && inputs.mini_app != true && inputs.speech_time_benchmark != true && inputs.agent_message == '' && !inputs.agent_voice && !inputs.foundation_check && !inputs.foundation_regular_entitlement && !inputs.verify_only && inputs.catalog_release_config == '' }}
        run: |
          echo "Enable cmp-server, ai-server or mini-app" >&2
          exit 1

  package-server:
    name: Package cmp-server
    needs: require-target
    if: ${{ inputs.cmp_server && !inputs.speech_time_benchmark && !inputs.verify_only }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CMP
        uses: ./.github/actions/setup-cmp

      - name: Test
        run: ./gradlew :server:test

      - name: Package
        run: ./gradlew :server:buildFatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: server-all
          path: cmp/server/build/libs/server-all.jar
          if-no-files-found: error
          retention-days: 1

  package-ai:
    name: Package ai-server
    needs: require-target
    if: ${{ inputs.ai_server && !inputs.speech_time_benchmark && !inputs.verify_only }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Stage runtime
        run: |
          STAGE="$RUNNER_TEMP/ai-service-runtime"
          mkdir -p "$STAGE"
          cp Dockerfile requirements.txt "$STAGE/"
          cp -R app "$STAGE/app"

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: ai-service
          path: ${{ runner.temp }}/ai-service-runtime
          if-no-files-found: error
          retention-days: 1

  deploy-mini-app:
    name: Deploy Mini App
    needs: require-target
    if: ${{ inputs.mini_app && !inputs.speech_time_benchmark && !inputs.verify_only }}
    uses: ./.github/workflows/deploy-mini-app.yml
    secrets: inherit

  deploy-server:
    name: Deploy cmp-server
    needs:
      - require-target
      - package-server
    if: ${{ !cancelled() && inputs.cmp_server && !inputs.speech_time_benchmark && !inputs.verify_only && needs.package-server.result == 'success' }}
    uses: ./.github/workflows/deploy-cmp-server.yml
    with:
      destination: dev
      billing_mock: ${{ inputs.billing_mock }}
      agent_test: ${{ inputs.agent_test }}
    secrets: inherit

  deploy-ai:
    name: Deploy ai-server
    needs:
      - require-target
      - package-ai
      - deploy-mini-app
    if: ${{ !cancelled() && inputs.ai_server && !inputs.speech_time_benchmark && !inputs.verify_only && needs.package-ai.result == 'success' && (!inputs.mini_app || needs.deploy-mini-app.result == 'success') }}
    uses: ./.github/workflows/deploy-ai-server.yml
    with:
      destination: dev
      agent_test: ${{ inputs.agent_test }}
    secrets: inherit

  speech-time-benchmark:
    name: Benchmark speech time on DEV AI
    needs: require-target
    if: ${{ inputs.speech_time_benchmark }}
    runs-on: ubuntu-latest
    environment: deploy-dev
    concurrency:
      group: ai-dev-benchmark
      cancel-in-progress: false
    env:
      DEV_AI_SERVER_HOST: ${{ secrets.DEV_AI_SERVER_HOST }}
      DEV_AI_SERVER_USER: ${{ secrets.DEV_AI_SERVER_USER }}
      DEV_AI_SERVER_SSH_KEY: ${{ secrets.DEV_AI_SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Measure with real DEV STT in a temporary container
        shell: bash
        run: |
          set -euo pipefail
          : "${DEV_AI_SERVER_HOST:?}"
          : "${DEV_AI_SERVER_USER:?}"
          : "${DEV_AI_SERVER_SSH_KEY:?}"
          archive="$RUNNER_TEMP/speech-time-benchmark.tgz"
          tar -czf "$archive" ai-service/app load/speech-time-dev-benchmark.py load/fixtures/librispeech-test-clean
          key="$RUNNER_TEMP/dev-ai-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEV_AI_SERVER_SSH_KEY" > "$key"
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          remote_archive="/tmp/speech-time-benchmark-${GITHUB_RUN_ID}.tgz"
          scp "${opts[@]}" "$archive" "${DEV_AI_SERVER_USER}@${DEV_AI_SERVER_HOST}:$remote_archive"
          ssh "${opts[@]}" "${DEV_AI_SERVER_USER}@${DEV_AI_SERVER_HOST}" \
            "BENCH_RUN_ID=$GITHUB_RUN_ID bash -s" <<'REMOTE'
          set -euo pipefail
          archive="/tmp/speech-time-benchmark-${BENCH_RUN_ID}.tgz"
          work=$(mktemp -d /tmp/speech-time-benchmark.XXXXXX)
          trap 'rm -rf "$work" "$archive"' EXIT
          tar -xzf "$archive" -C "$work"
          echo "DEV AI logical CPUs: $(nproc)"
          image=$(docker inspect --format '{{.Image}}' ai-service)
          docker run --rm --name "speech-time-benchmark-${BENCH_RUN_ID}" \
            --env-file /opt/ai-service/.env \
            -v "$work:/bench:ro" -w /bench -e PYTHONPATH=/bench/ai-service \
            "$image" sh -c \
            'pip install --quiet --no-cache-dir webrtcvad-wheels==2.0.14.post1 && python load/speech-time-dev-benchmark.py'
          REMOTE

  agent-dialogue:
    name: Test one learner turn on DEV
    needs: require-target
    if: ${{ inputs.agent_message != '' }}
    runs-on: ubuntu-latest
    environment: deploy-dev
    timeout-minutes: 6
    env:
      CMP_HOST: ${{ secrets.DEV_CMP_SERVER_HOST }}
      CMP_USER: ${{ secrets.DEV_CMP_SERVER_USER }}
      CMP_KEY: ${{ secrets.DEV_CMP_SERVER_SSH_KEY }}
      LEARNER_MESSAGE: ${{ inputs.agent_message }}
      STUDENT_ID: ${{ inputs.agent_student_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Send one turn over SSH loopback
        shell: bash
        run: |
          set -euo pipefail
          : "${CMP_HOST:?}"
          : "${CMP_USER:?}"
          : "${CMP_KEY:?}"
          key="$RUNNER_TEMP/agent-dev-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$CMP_KEY" > "$key"
          opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o HostKeyAlias=speaky-dev-cmp -o UserKnownHostsFile="$GITHUB_WORKSPACE/infra/dev/known_hosts")
          work="/tmp/speaky-agent-${GITHUB_RUN_ID}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'input.json'
          output.write_text(json.dumps({'message': os.environ['LEARNER_MESSAGE'],
                                        'studentId': os.environ['STUDENT_ID']}))
          output.chmod(0o600)
          PY
          ssh "${opts[@]}" "$CMP_USER@$CMP_HOST" "mkdir -m 700 '$work'"
          scp "${opts[@]}" infra/dev/agent-dialogue.py infra/dev/agent-dialogue-remote.py \
            "$RUNNER_TEMP/input.json" "$CMP_USER@$CMP_HOST:$work/"
          set +e
          ssh "${opts[@]}" "$CMP_USER@$CMP_HOST" "python3 '$work/agent-dialogue-remote.py' '$work'"
          result=$?
          set -e
          scp "${opts[@]}" "$CMP_USER@$CMP_HOST:$work/result.json" "$RUNNER_TEMP/agent-result.json" || true
          scp "${opts[@]}" "$CMP_USER@$CMP_HOST:$work/transcript.json" "$RUNNER_TEMP/agent-transcript.json" || true
          scp "${opts[@]}" "$CMP_USER@$CMP_HOST:$work/transcript.md" "$RUNNER_TEMP/agent-transcript.md" || true
          scp "${opts[@]}" "$CMP_USER@$CMP_HOST:$work/error.txt" "$RUNNER_TEMP/agent-error.txt" || true
          ssh "${opts[@]}" "$CMP_USER@$CMP_HOST" "rm -f '$work/input.json' '$work/agent-dialogue.py' '$work/agent-dialogue-remote.py' '$work/result.json' '$work/transcript.json' '$work/transcript.md' '$work/error.txt'; rmdir '$work'" || true
          if [ -s "$RUNNER_TEMP/agent-result.json" ]; then cat "$RUNNER_TEMP/agent-result.json"; fi
          if [ -s "$RUNNER_TEMP/agent-error.txt" ]; then cat "$RUNNER_TEMP/agent-error.txt" >&2; fi
          exit "$result"
      - name: Upload learner dialogue
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-dialogue-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent-result.json
            ${{ runner.temp }}/agent-transcript.json
            ${{ runner.temp }}/agent-transcript.md
            ${{ runner.temp }}/agent-error.txt
          if-no-files-found: ignore
          retention-days: 7

  foundation-check:
    name: Check synthetic Foundation contract on DEV
    needs: require-target
    if: ${{ inputs.foundation_check || inputs.foundation_regular_entitlement }}
    runs-on: ubuntu-latest
    environment: deploy-dev
    timeout-minutes: 6
    env:
      CMP_HOST: ${{ secrets.DEV_CMP_SERVER_HOST }}
      CMP_USER: ${{ secrets.DEV_CMP_SERVER_USER }}
      CMP_KEY: ${{ secrets.DEV_CMP_SERVER_SSH_KEY }}
      FOUNDATION_STUDENT_ID: ${{ inputs.foundation_student_id }}
      FOUNDATION_SCENARIO: ${{ inputs.foundation_scenario }}
      FOUNDATION_CHECK: ${{ inputs.foundation_check }}
      FOUNDATION_REGULAR_ENTITLEMENT: ${{ inputs.foundation_regular_entitlement }}
    steps:
      - uses: actions/checkout@v5
      - name: Run repo scenario over SSH loopback
        shell: bash
        run: |
          set -euo pipefail
          : "${CMP_HOST:?}"
          : "${CMP_USER:?}"
          : "${CMP_KEY:?}"
          if [[ "$FOUNDATION_CHECK" == true && "$FOUNDATION_REGULAR_ENTITLEMENT" == true ]]; then
            echo "Choose one Foundation mode" >&2
            exit 1
          fi
          if [[ "${{ inputs.cmp_server }}" == true || "${{ inputs.ai_server }}" == true || "${{ inputs.mini_app }}" == true ]]; then
            echo "Run Foundation evidence separately from deployment" >&2
            exit 1
          fi
          mode=scenario
          if [[ "$FOUNDATION_REGULAR_ENTITLEMENT" == true ]]; then mode=regular_entitlement; fi
          if [[ "$mode" == scenario ]]; then
            [[ "$FOUNDATION_SCENARIO" =~ ^foundation-[a-z0-9-]+\.json$ ]]
            test -f "infra/dev/scenarios/$FOUNDATION_SCENARIO"
          fi
          key="$RUNNER_TEMP/foundation-dev-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$CMP_KEY" > "$key"
          opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o HostKeyAlias=speaky-dev-cmp -o UserKnownHostsFile="$GITHUB_WORKSPACE/infra/dev/known_hosts")
          work="/tmp/speaky-foundation-${GITHUB_RUN_ID}"
          FOUNDATION_MODE="$mode" python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'foundation-input.json'
          path.write_text(json.dumps({'mode': os.environ['FOUNDATION_MODE'],
                                      'studentId': os.environ['FOUNDATION_STUDENT_ID'],
                                      'scenario': os.environ['FOUNDATION_SCENARIO']}))
          path.chmod(0o600)
          PY
          ssh "${opts[@]}" "$CMP_USER@$CMP_HOST" "mkdir -m 700 '$work'"
          scp "${opts[@]}" infra/dev/foundation-check-remote.py "$RUNNER_TEMP/foundation-input.json" "$CMP_USER@$CMP_HOST:$work/"
          if [[ "$mode" == scenario ]]; then
            scp "${opts[@]}" "infra/dev/scenarios/$FOUNDATION_SCENARIO" "$CMP_USER@$CMP_HOST:$work/"
          fi
          set +e
          ssh "${opts[@]}" "$CMP_USER@$CMP_HOST" "python3 '$work/foundation-check-remote.py' '$work'"
          result=$?
          set -e
          scp "${opts[@]}" "$CMP_USER@$CMP_HOST:$work/result.json" "$RUNNER_TEMP/foundation-result.json" || true
          ssh "${opts[@]}" "$CMP_USER@$CMP_HOST" "rm -f '$work/'*; rmdir '$work'" || true
          if [ -s "$RUNNER_TEMP/foundation-result.json" ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'foundation-result.json').read_text())
          print('studentId='+str(result.get('studentId','')))
          for step in result.get('steps',[]):
              print(str(step.get('name','step'))+' HTTP '+str(step.get('httpStatus',0)))
          if 'error' in result: print('error='+str(result['error']))
          PY
          fi
          rm -f "$key" "$RUNNER_TEMP/foundation-input.json"
          exit "$result"
      - name: Upload synthetic Foundation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: foundation-check-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-result.json
          if-no-files-found: ignore
          retention-days: 7

  catalog-dev:
    name: Validate or publish exact DEV catalog
    needs: require-target
    if: ${{ inputs.catalog_release_config != '' }}
    runs-on: ubuntu-latest
    environment: deploy-dev
    timeout-minutes: 12
    concurrency:
      group: ktor-dev
      cancel-in-progress: false
    env:
      DEV_HOST: ${{ secrets.DEV_CMP_SERVER_HOST }}
      DEV_USER: ${{ secrets.DEV_CMP_SERVER_USER }}
      DEV_KEY: ${{ secrets.DEV_CMP_SERVER_SSH_KEY }}
      CATALOG_RELEASE_CONFIG: ${{ inputs.catalog_release_config }}
    steps:
      - uses: actions/checkout@v5
      - name: Check exact manifest and explicit review input
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.cmp_server }}" == true || "${{ inputs.ai_server }}" == true || "${{ inputs.mini_app }}" == true ]]; then
            echo 'Run catalog release separately from deployment' >&2
            exit 1
          fi
          : "${DEV_HOST:?}" "${DEV_USER:?}" "${DEV_KEY:?}"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          config = json.loads(os.environ['CATALOG_RELEASE_CONFIG'])
          assert isinstance(config, dict) and set(config) == {'version', 'sha256', 'publish', 'reviewer', 'reviewReference'}, 'invalid_catalog_config'
          assert type(config['publish']) is bool, 'invalid_catalog_publish'
          assert all(isinstance(config[key], str) for key in ('version', 'sha256', 'reviewer', 'reviewReference')), 'invalid_catalog_config'
          raw = Path('learning-catalog/v1/catalog.json').read_bytes()
          actual = hashlib.sha256(raw).hexdigest()
          expected = config['sha256']
          version = config['version']
          assert re.fullmatch(r'[0-9a-f]{64}', expected) and actual == expected, 'catalog_sha256_mismatch'
          assert re.fullmatch(r'[a-z0-9][a-z0-9._-]{0,79}', version), 'invalid_catalog_version'
          assert json.loads(raw)['version'] == version, 'catalog_version_mismatch'
          if config['publish']:
              assert config['reviewer'].strip(), 'reviewer_required'
              assert config['reviewReference'].startswith('https://'), 'review_reference_required'
          print('Exact catalog version and SHA-256 verified; publication input checked')
          PY
      - name: Run private DEV operator command
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/catalog-dev-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEV_KEY" > "$key"
          opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o HostKeyAlias=speaky-dev-cmp -o UserKnownHostsFile="$GITHUB_WORKSPACE/infra/dev/known_hosts")
          work="/tmp/speaky-catalog-${GITHUB_RUN_ID}"
          umask 077
          python3 - "$RUNNER_TEMP/catalog-input.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], 'w') as output:
              json.dump(json.loads(os.environ['CATALOG_RELEASE_CONFIG']), output)
          PY
          ssh "${opts[@]}" "$DEV_USER@$DEV_HOST" "mkdir -m 700 '$work'"
          trap 'ssh "${opts[@]}" "$DEV_USER@$DEV_HOST" "rm -f $work/catalog.json $work/catalog-release-remote.py $work/catalog-input.json; rmdir $work" >/dev/null 2>&1 || true' EXIT
          scp "${opts[@]}" learning-catalog/v1/catalog.json infra/dev/catalog-release-remote.py \
            "$RUNNER_TEMP/catalog-input.json" "$DEV_USER@$DEV_HOST:$work/"
          ssh "${opts[@]}" "$DEV_USER@$DEV_HOST" "python3 '$work/catalog-release-remote.py' '$work'"

  prepare-controlled-audio:
    if: ${{ inputs.agent_voice && inputs.agent_voice_scenario == 'controlled-audio-only' }}
    permissions:
      contents: read
    uses: ./.github/workflows/prepare-controlled-voice-audio.yml

  agent-voice:
    name: Test synthetic voice lesson on DEV
    needs: require-target
    if: ${{ inputs.agent_voice && inputs.agent_voice_scenario != 'controlled-audio-only' }}
    runs-on: ubuntu-latest
    environment: deploy-dev
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      VOICE_SCENARIO: ${{ inputs.agent_voice_scenario }}
      VOICE_AUDIO_RUN_ID: ${{ inputs.agent_voice_audio_run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare voice runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$VOICE_AUDIO_RUN_ID" ]]; then [[ "$VOICE_AUDIO_RUN_ID" =~ ^[0-9]+$ ]]; fi
          if [[ "$VOICE_SCENARIO" == regular-action-controlled-input && -z "$VOICE_AUDIO_RUN_ID" ]]; then
            echo 'Controlled input requires a prepared audio run ID' >&2
            exit 2
          fi
          echo 'Voice preflight: pip install'
          if [[ "$VOICE_SCENARIO" != dependencies-only ]]; then
            timeout --kill-after=5s 45s python3 -m pip install --quiet --disable-pip-version-check websockets==15.0.1
          fi
          echo 'Voice preflight: pip ready'
          if [[ "$VOICE_SCENARIO" == dependencies-only || ( "$VOICE_SCENARIO" != read-only && -z "$VOICE_AUDIO_RUN_ID" ) ]]; then
            echo 'Voice preflight: install pinned eSpeak NG wheel'
            timeout --kill-after=5s 60s python3 -m pip install --quiet --disable-pip-version-check \
              --only-binary=:all: --no-deps --require-hashes -r <(
                printf '%s\n' 'espeakng-loader==0.2.4 --hash=sha256:08721baf27d13d461f6be6eed9a65277e70d68234ff484fd8b9897b222cdcb6d'
              )
          fi
      - name: Build full voice inputs without DEV access
        if: ${{ inputs.agent_voice_scenario == 'dependencies-only' }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s python3 infra/dev/prepare-voice-audio.py generate "$RUNNER_TEMP/voice-inputs" \
            infra/dev/scenarios/voice-{phase-probe,regular-action,regular-action-clear-finish,short,early-exit}.json
      - name: Upload verified voice inputs
        if: ${{ inputs.agent_voice_scenario == 'dependencies-only' }}
        uses: actions/upload-artifact@v6
        with:
          name: voice-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/voice-inputs/
          if-no-files-found: error
          retention-days: 7
      - name: Download prepared voice inputs
        if: ${{ inputs.agent_voice_audio_run_id != '' && inputs.agent_voice_scenario != 'read-only' && inputs.agent_voice_scenario != 'dependencies-only' }}
        uses: actions/download-artifact@v7
        with:
          name: voice-inputs-${{ inputs.agent_voice_audio_run_id }}
          path: ${{ runner.temp }}/voice-inputs
          github-token: ${{ github.token }}
          run-id: ${{ inputs.agent_voice_audio_run_id }}
      - name: Verify PCM and scenario before voice admission
        if: ${{ inputs.agent_voice_scenario != 'read-only' && inputs.agent_voice_scenario != 'dependencies-only' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VOICE_SCENARIO" in
            regular-action-mute) scenario=infra/dev/scenarios/voice-regular-action.json ;;
            short|early-exit|phase-probe|regular-action|regular-action-clear-finish|regular-action-controlled-input) scenario="infra/dev/scenarios/voice-$VOICE_SCENARIO.json" ;;
            *) echo 'Unsupported voice scenario' >&2; exit 2 ;;
          esac
          if [[ -z "$VOICE_AUDIO_RUN_ID" ]]; then
            timeout 60s python3 infra/dev/prepare-voice-audio.py generate "$RUNNER_TEMP/voice-inputs" "$scenario"
          fi
          python3 infra/dev/prepare-voice-audio.py verify "$RUNNER_TEMP/voice-inputs" "$scenario" \
            > "$RUNNER_TEMP/verified-voice-scenario.json"
      - name: Run voice client through private loopback tunnels
        if: ${{ inputs.agent_voice_scenario != 'dependencies-only' }}
        shell: bash
        env:
          CMP_HOST: ${{ secrets.DEV_CMP_SERVER_HOST }}
          CMP_USER: ${{ secrets.DEV_CMP_SERVER_USER }}
          CMP_KEY: ${{ secrets.DEV_CMP_SERVER_SSH_KEY }}
          AI_HOST: ${{ secrets.DEV_AI_SERVER_HOST }}
          AI_USER: ${{ secrets.DEV_AI_SERVER_USER }}
          AI_KEY: ${{ secrets.DEV_AI_SERVER_SSH_KEY }}
          STUDENT_ID: ${{ inputs.agent_voice_student_id }}
          LESSON_ID: ${{ inputs.agent_voice_lesson_id }}
        run: |
          set -euo pipefail
          : "${CMP_HOST:?}" "${CMP_USER:?}" "${CMP_KEY:?}"
          : "${AI_HOST:?}" "${AI_USER:?}" "${AI_KEY:?}"
          python3 - <<'PY'
          import os, uuid
          uuid.UUID(os.environ['STUDENT_ID'])
          uuid.UUID(os.environ['LESSON_ID'])
          PY
          if [[ "$VOICE_SCENARIO" == read-only ]]; then
            scenario=infra/dev/scenarios/voice-read-only.json
          else
            scenario="$RUNNER_TEMP/verified-voice-scenario.json"
          fi
          voice_options=()
          if [[ "$VOICE_SCENARIO" == regular-action-mute || "$VOICE_SCENARIO" == regular-action-clear-finish ||
                "$VOICE_SCENARIO" == regular-action-controlled-input ]]; then
            voice_options+=(--mute-boundary-turn 3)
          fi
          cmp_key="$RUNNER_TEMP/agent-voice-cmp-key"
          ai_key="$RUNNER_TEMP/agent-voice-ai-key"
          install -m 600 /dev/null "$cmp_key"
          install -m 600 /dev/null "$ai_key"
          printf '%s\n' "$CMP_KEY" > "$cmp_key"
          printf '%s\n' "$AI_KEY" > "$ai_key"
          cmp_opts=(-i "$cmp_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2
            -o HostKeyAlias=speaky-dev-cmp -o UserKnownHostsFile="$GITHUB_WORKSPACE/infra/dev/known_hosts")
          ai_opts=(-i "$ai_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2
            -o HostKeyAlias=speaky-dev-ai -o UserKnownHostsFile="$GITHUB_WORKSPACE/infra/dev/known_hosts")
          cmp_config="$RUNNER_TEMP/agent-voice-cmp.json"
          ai_config="$RUNNER_TEMP/agent-voice-ai.json"
          echo 'Voice preflight: checking DEV containers'
          timeout 35s ssh "${cmp_opts[@]}" "$CMP_USER@$CMP_HOST" 'python3 -' > "$cmp_config" <<'PY'
          import json, subprocess
          info = json.loads(subprocess.check_output(['docker', 'inspect', 'speaking-coach']))[0]
          env = dict(item.split('=', 1) for item in info['Config']['Env'] if '=' in item)
          print(json.dumps({'running': info['State']['Running'], 'dev': env.get('SPEAKY_ENV') == 'dev',
                            'enabled': env.get('AGENT_TEST_ENABLED') == 'true',
                            'port': env.get('SERVER_PORT', '443'), 'token': env.get('AI_INTERNAL_TOKEN', '')}))
          PY
          timeout 35s ssh "${ai_opts[@]}" "$AI_USER@$AI_HOST" 'python3 -' > "$ai_config" <<'PY'
          import json, subprocess
          info = json.loads(subprocess.check_output(['docker', 'inspect', 'ai-service']))[0]
          env = dict(item.split('=', 1) for item in info['Config']['Env'] if '=' in item)
          print(json.dumps({'running': info['State']['Running'], 'dev': env.get('SPEAKY_ENV') == 'dev',
                            'enabled': env.get('AGENT_TEST_ENABLED') == 'true',
                            'port': info['NetworkSettings']['Ports']['8090/tcp'][0]['HostPort']}))
          PY
          chmod 600 "$cmp_config" "$ai_config"
          python3 - "$cmp_config" "$ai_config" <<'PY'
          import json, sys
          cmp, ai = [json.load(open(path)) for path in sys.argv[1:]]
          assert all(cmp[key] for key in ('running', 'dev', 'enabled', 'token'))
          assert all(ai[key] for key in ('running', 'dev', 'enabled'))
          assert str(cmp['port']).isdigit() and str(ai['port']).isdigit()
          print('DEV CMP and AI voice gates: ready')
          PY
          cmp_port=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["port"])' "$cmp_config")
          ai_port=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["port"])' "$ai_config")
          token=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$cmp_config")
          ssh "${cmp_opts[@]}" -o ExitOnForwardFailure=yes -N \
            -L "127.0.0.1:18443:127.0.0.1:$cmp_port" "$CMP_USER@$CMP_HOST" &
          cmp_tunnel=$!
          ssh "${ai_opts[@]}" -o ExitOnForwardFailure=yes -N \
            -L "127.0.0.1:18090:127.0.0.1:$ai_port" "$AI_USER@$AI_HOST" &
          ai_tunnel=$!
          trap 'kill "$cmp_tunnel" "$ai_tunnel" 2>/dev/null || true; rm -f "$cmp_config" "$ai_config" "$cmp_key" "$ai_key"' EXIT
          sleep 2
          kill -0 "$cmp_tunnel" "$ai_tunnel"
          echo 'Voice preflight: tunnels ready, starting client'
          AI_INTERNAL_TOKEN="$token" python3 infra/dev/agent-voice.py \
            "$scenario" \
            --ktor https://127.0.0.1:18443 --ai http://127.0.0.1:18090 \
            --student "$STUDENT_ID" --lesson "$LESSON_ID" \
            --output "$RUNNER_TEMP/agent-voice-run" "${voice_options[@]}"
      - name: Upload synthetic voice dialogue
        if: ${{ always() && inputs.agent_voice_scenario != 'dependencies-only' }}
        uses: actions/upload-artifact@v6
        with:
          name: agent-voice-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-voice-run/
          if-no-files-found: ignore
          retention-days: 7

  verify-tutor-dev:
    name: Verify DEV tutor readiness
    needs: [deploy-server, deploy-ai]
    if: ${{ !cancelled() && (inputs.verify_only || (needs.deploy-server.result == 'success' && needs.deploy-ai.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: deploy-dev
    env:
      CMP_HOST: ${{ secrets.DEV_CMP_SERVER_HOST }}
      CMP_USER: ${{ secrets.DEV_CMP_SERVER_USER }}
      CMP_KEY: ${{ secrets.DEV_CMP_SERVER_SSH_KEY }}
      AI_HOST: ${{ secrets.DEV_AI_SERVER_HOST }}
      AI_USER: ${{ secrets.DEV_AI_SERVER_USER }}
      AI_KEY: ${{ secrets.DEV_AI_SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify artifacts, health, configuration and internal auth
        shell: bash
        run: |
          set -euo pipefail
          smoke_flag=""
          billing_flag=""
          if [ "${{ inputs.billing_mock }}" = true ]; then billing_flag="--mock-billing"; fi
          for component in ai cmp; do
            if [ "$component" = ai ]; then
              target_host="$AI_HOST"; target_user="$AI_USER"; key_body="$AI_KEY"
            else
              target_host="$CMP_HOST"; target_user="$CMP_USER"; key_body="$CMP_KEY"
              if [ "${{ inputs.tutor_smoke }}" = true ]; then smoke_flag="--smoke"; fi
            fi
            key="$RUNNER_TEMP/verify-$component-key"
            install -m 600 /dev/null "$key"
            printf '%s\n' "$key_body" > "$key"
            ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o HostKeyAlias="speaky-dev-$component" -o UserKnownHostsFile="$GITHUB_WORKSPACE/infra/dev/known_hosts" \
              "$target_user@$target_host" "python3 - $component $GITHUB_SHA $smoke_flag $billing_flag" < infra/dev/verify-tutor.py
          done
      - name: Inspect safe tutor error codes
        if: ${{ inputs.diagnose_tutor }}
        shell: bash
        env:
          ERROR_ID: ${{ inputs.diagnose_error_id }}
          CALL_SESSION_ID: ${{ inputs.diagnose_call_session_id }}
        run: |
          set -euo pipefail
          if [ -n "$ERROR_ID" ]; then [[ "$ERROR_ID" =~ ^[0-9a-f]{32}$ ]] || exit 2; fi
          if [ -n "$CALL_SESSION_ID" ]; then [[ "$CALL_SESSION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || exit 2; fi
          key="$RUNNER_TEMP/verify-ai-key"
          ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=speaky-dev-ai -o UserKnownHostsFile="$GITHUB_WORKSPACE/infra/dev/known_hosts" \
            "$AI_USER@$AI_HOST" "python3 - '$ERROR_ID' '$CALL_SESSION_ID'" < infra/dev/diagnose-tutor.py
      - name: Inspect safe Ktor error codes
        if: ${{ !cancelled() && inputs.diagnose_tutor_at != '' }}
        shell: bash
        env:
          DIAGNOSTIC_AT: ${{ inputs.diagnose_tutor_at }}
          JOB_ID: ${{ inputs.diagnose_foundation_job_id }}
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || exit 2
          if [ -n "$JOB_ID" ]; then [[ "$JOB_ID" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]] || exit 2; fi
          key="$RUNNER_TEMP/verify-cmp-key"
          ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=speaky-dev-cmp -o UserKnownHostsFile="$GITHUB_WORKSPACE/infra/dev/known_hosts" \
            "$CMP_USER@$CMP_HOST" "python3 - '$DIAGNOSTIC_AT' '$JOB_ID'" < infra/dev/diagnose-tutor-cmp.py
