name: Redeploy DEV

on:
  workflow_dispatch:
    inputs:
      cmp_server:
        description: cmp-server
        type: boolean
        default: true
      ai_server:
        description: ai-server
        type: boolean
        default: true
      diagnostics_only:
        description: Read recent DEV Telegram errors without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  require-target:
    name: Require a host
    runs-on: ubuntu-latest
    steps:
      - name: Fail if both hosts off
        if: ${{ inputs.cmp_server != true && inputs.ai_server != true && inputs.diagnostics_only != true }}
        run: |
          echo "Enable cmp-server and/or ai-server" >&2
          exit 1

  package-server:
    name: Package cmp-server
    needs: require-target
    if: ${{ inputs.cmp_server && !inputs.diagnostics_only }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CMP
        uses: ./.github/actions/setup-cmp

      - name: Test
        run: ./gradlew :server:test

      - name: Package
        run: ./gradlew :server:buildFatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: server-all
          path: cmp/server/build/libs/server-all.jar
          if-no-files-found: error
          retention-days: 1

  package-ai:
    name: Package ai-server
    needs: require-target
    if: ${{ inputs.ai_server && !inputs.diagnostics_only }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Stage runtime
        run: |
          STAGE="$RUNNER_TEMP/ai-service-runtime"
          mkdir -p "$STAGE"
          cp Dockerfile requirements.txt "$STAGE/"
          cp -R app "$STAGE/app"

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: ai-service
          path: ${{ runner.temp }}/ai-service-runtime
          if-no-files-found: error
          retention-days: 1

  deploy-server:
    name: Deploy cmp-server
    needs:
      - require-target
      - package-server
    if: ${{ !cancelled() && inputs.cmp_server && !inputs.diagnostics_only && needs.package-server.result == 'success' }}
    uses: ./.github/workflows/deploy-cmp-server.yml
    with:
      destination: dev
    secrets: inherit

  deploy-ai:
    name: Deploy ai-server
    needs:
      - require-target
      - package-ai
    if: ${{ !cancelled() && inputs.ai_server && !inputs.diagnostics_only && needs.package-ai.result == 'success' }}
    uses: ./.github/workflows/deploy-ai-server.yml
    with:
      destination: dev
    secrets: inherit

  diagnose-server:
    name: Read DEV vocabulary errors
    needs: require-target
    if: ${{ inputs.diagnostics_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Read exception types and stack locations
        env:
          HOST: ${{ secrets.DEV_CMP_SERVER_HOST }}
          USER: ${{ secrets.DEV_CMP_SERVER_USER }}
          KEY_BODY: ${{ secrets.DEV_CMP_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${HOST:?}" "${USER:?}" "${KEY_BODY:?}"
          KEY="$RUNNER_TEMP/vps_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$KEY_BODY" > "$KEY"
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes "${USER}@${HOST}" \
            "docker logs --since 2h speaking-coach 2>&1" |
            python3 -c 'import re,sys
          lines=sys.stdin.readlines()
          for i,line in enumerate(lines):
              if "Vocabulary action failed" not in line and "Telegram message failed" not in line:
                  continue
              print("failure:", "Vocabulary action" if "Vocabulary action failed" in line else "Telegram message")
              for detail in lines[i+1:i+24]:
                  clean=detail.strip()
                  if clean.startswith(("Caused by:", "at com.eliteteam.speakingcoach", "at io.ktor.client", "java.lang.", "kotlin.")):
                      clean=re.sub(r"https?://[^ ]+", "[url]", clean)
                      print(clean[:250])'
