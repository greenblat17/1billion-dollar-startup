name: Redeploy DEV

on:
  workflow_dispatch:
    inputs:
      cmp_server:
        description: cmp-server
        type: boolean
        default: true
      ai_server:
        description: ai-server
        type: boolean
        default: true
      export_dialogue:
        description: Export the latest Alexander Gusev DEV chat as an encrypted artifact; do not deploy
        type: boolean
        default: false
      recipient_cert:
        description: Public X.509 certificate for the one-time encrypted export
        type: string
        required: false

permissions:
  contents: read

jobs:
  require-target:
    name: Require a host
    runs-on: ubuntu-latest
    steps:
      - name: Fail if both hosts off
        if: ${{ inputs.cmp_server != true && inputs.ai_server != true && inputs.export_dialogue != true }}
        run: |
          echo "Enable cmp-server and/or ai-server" >&2
          exit 1

  package-server:
    name: Package cmp-server
    needs: require-target
    if: ${{ inputs.cmp_server && !inputs.export_dialogue }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CMP
        uses: ./.github/actions/setup-cmp

      - name: Test
        run: ./gradlew :server:test

      - name: Package
        run: ./gradlew :server:buildFatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: server-all
          path: cmp/server/build/libs/server-all.jar
          if-no-files-found: error
          retention-days: 1

  package-ai:
    name: Package ai-server
    needs: require-target
    if: ${{ inputs.ai_server && !inputs.export_dialogue }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Stage runtime
        run: |
          STAGE="$RUNNER_TEMP/ai-service-runtime"
          mkdir -p "$STAGE"
          cp Dockerfile requirements.txt "$STAGE/"
          cp -R app "$STAGE/app"

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: ai-service
          path: ${{ runner.temp }}/ai-service-runtime
          if-no-files-found: error
          retention-days: 1

  deploy-server:
    name: Deploy cmp-server
    needs:
      - require-target
      - package-server
    if: ${{ !cancelled() && inputs.cmp_server && !inputs.export_dialogue && needs.package-server.result == 'success' }}
    uses: ./.github/workflows/deploy-cmp-server.yml
    with:
      destination: dev
    secrets: inherit

  deploy-ai:
    name: Deploy ai-server
    needs:
      - require-target
      - package-ai
    if: ${{ !cancelled() && inputs.ai_server && !inputs.export_dialogue && needs.package-ai.result == 'success' }}
    uses: ./.github/workflows/deploy-ai-server.yml
    with:
      destination: dev
    secrets: inherit

  export-dialogue:
    name: Export encrypted DEV dialogue
    needs: require-target
    if: ${{ inputs.export_dialogue }}
    runs-on: ubuntu-latest
    steps:
      - name: Read and encrypt chat history
        env:
          HOST: ${{ secrets.DEV_CMP_SERVER_HOST }}
          USER: ${{ secrets.DEV_CMP_SERVER_USER }}
          KEY_BODY: ${{ secrets.DEV_CMP_SERVER_SSH_KEY }}
          AI_HOST: ${{ secrets.DEV_AI_SERVER_HOST }}
          AI_USER: ${{ secrets.DEV_AI_SERVER_USER }}
          AI_KEY_BODY: ${{ secrets.DEV_AI_SERVER_SSH_KEY }}
          CERT: ${{ inputs.recipient_cert }}
        run: |
          set -euo pipefail
          : "${HOST:?}" "${USER:?}" "${KEY_BODY:?}" "${CERT:?}"
          KEY="$RUNNER_TEMP/vps_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$KEY_BODY" > "$KEY"
          AI_KEY="$RUNNER_TEMP/ai_vps_key"
          install -m 600 /dev/null "$AI_KEY"
          printf '%s\n' "$AI_KEY_BODY" > "$AI_KEY"
          printf '%s\n' "$CERT" > "$RUNNER_TEMP/recipient.crt"
          SSH=(ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes "${USER}@${HOST}")
          DB_USER="$("${SSH[@]}" 'docker exec postgres printenv POSTGRES_USER')"
          DB_NAME="$("${SSH[@]}" 'docker exec postgres printenv POSTGRES_DB')"
          cat > "$RUNNER_TEMP/dialogue.sql" <<'SQL'
          WITH target AS (
              SELECT chat_id, display_name, last_incoming_at
              FROM interaction_chats
              WHERE display_name ILIKE '%Александр%Гусев%'
                AND last_incoming_at > now() - interval '24 hours'
              ORDER BY last_incoming_at DESC LIMIT 1
          )
          SELECT jsonb_build_object(
              'chat', to_jsonb(target),
              'events', COALESCE((
                  SELECT jsonb_agg(jsonb_build_object(
                      'at', e.occurred_at, 'direction', e.direction, 'kind', e.kind,
                      'status', e.status, 'content', c.content, 'messageId', e.message_id,
                      'attemptId', e.attempt_id) ORDER BY e.occurred_at, e.event_id)
                  FROM interaction_events e
                  LEFT JOIN interaction_content c ON c.event_id = e.event_id
                  WHERE e.chat_id = target.chat_id
                    AND e.occurred_at > now() - interval '24 hours'
              ), '[]'::jsonb)
          ) FROM target;
          SQL
          "${SSH[@]}" "docker exec -i postgres psql -U '$DB_USER' -d '$DB_NAME' -qAt" \
            < "$RUNNER_TEMP/dialogue.sql" > "$RUNNER_TEMP/dialogue.json"
          python3 - "$RUNNER_TEMP/dialogue.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as source:
              data=json.load(source)
          if not data.get('chat') or not data.get('events'):
              raise SystemExit('No recent matching chat events')
          print('Matched one chat; events:', len(data['events']))
          PY
          python3 - "$RUNNER_TEMP/dialogue.json" "$AI_KEY" <<'PY'
          import json,os,subprocess,sys
          path,key=sys.argv[1:]
          with open(path) as source:
              data=json.load(source)
          chat_id=data['chat']['chat_id']
          data['subtitles']={}
          for event in data['events']:
              if event['kind'] != 'sendVoice' or event['status'] != 'accepted' or not event['messageId']:
                  continue
              message_id=event['messageId']
              redis_key=f'vocabulary:subtitle:tg-{chat_id}:{message_id}'
              result=subprocess.run(['ssh','-i',key,'-o','StrictHostKeyChecking=accept-new',
                  '-o','IdentitiesOnly=yes',f"{os.environ['AI_USER']}@{os.environ['AI_HOST']}",
                  f'docker exec redis redis-cli --raw GET {redis_key}'],
                  capture_output=True,text=True,timeout=25)
              if result.returncode:
                  raise SystemExit('Could not read a DEV subtitle')
              if result.stdout.strip():
                  data['subtitles'][str(message_id)]=result.stdout.strip()
          with open(path,'w') as destination:
              json.dump(data,destination,ensure_ascii=False)
          print('Saved voice subtitles:',len(data['subtitles']))
          PY
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in "$RUNNER_TEMP/dialogue.json" -out "$RUNNER_TEMP/dialogue.p7m" "$RUNNER_TEMP/recipient.crt"
          rm "$RUNNER_TEMP/dialogue.json" "$RUNNER_TEMP/dialogue.sql"
      - name: Upload encrypted dialogue
        uses: actions/upload-artifact@v6
        with:
          name: dev-dialogue-encrypted
          path: ${{ runner.temp }}/dialogue.p7m
          if-no-files-found: error
          retention-days: 1
