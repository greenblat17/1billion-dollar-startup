name: Deploy cmp-server

on:
  workflow_call:
    inputs:
      destination:
        description: prod or dev
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy cmp-server (${{ inputs.destination }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination == 'prod' && 'deploy-prod' || 'deploy-dev' }}
    concurrency:
      group: ktor-${{ inputs.destination }}
      cancel-in-progress: false
    env:
      DESTINATION: ${{ inputs.destination }}
      PROD_CMP_SERVER_HOST: ${{ secrets.PROD_CMP_SERVER_HOST }}
      PROD_CMP_SERVER_USER: ${{ secrets.PROD_CMP_SERVER_USER }}
      PROD_CMP_SERVER_SSH_KEY: ${{ secrets.PROD_CMP_SERVER_SSH_KEY }}
      PROD_CMP_SERVER_ENV: ${{ secrets.PROD_CMP_SERVER_ENV }}
      DEV_CMP_SERVER_HOST: ${{ secrets.DEV_CMP_SERVER_HOST }}
      DEV_CMP_SERVER_USER: ${{ secrets.DEV_CMP_SERVER_USER }}
      DEV_CMP_SERVER_SSH_KEY: ${{ secrets.DEV_CMP_SERVER_SSH_KEY }}
      DEV_CMP_SERVER_ENV: ${{ secrets.DEV_CMP_SERVER_ENV }}
      METRICS_PASSWORD: ${{ secrets.METRICS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download fat JAR
        uses: actions/download-artifact@v7
        with:
          name: server-all
          path: vps-upload

      - name: Stage runtime files
        run: |
          set -euo pipefail
          cp infra/server/Dockerfile.runtime vps-upload/Dockerfile.runtime
          cp infra/server/deploy-remote.sh vps-upload/deploy-remote.sh
          cp infra/postgres/deploy-remote.sh vps-upload/deploy-postgres.sh
          chmod +x vps-upload/deploy-remote.sh vps-upload/deploy-postgres.sh
          umask 077
          if [ "$DESTINATION" = prod ]; then
            ENV_BODY="${PROD_CMP_SERVER_ENV:-}"
            ENV_NAME=PROD_CMP_SERVER_ENV
          else
            ENV_BODY="${DEV_CMP_SERVER_ENV:-}"
            ENV_NAME=DEV_CMP_SERVER_ENV
          fi
          if [ -z "$ENV_BODY" ]; then
            echo "$ENV_NAME is empty" >&2
            exit 1
          fi
          printf '%s\n' "$ENV_BODY" > vps-upload/.env
          if [ -n "${METRICS_PASSWORD:-}" ]; then
            tmp=$(mktemp)
            grep -v '^METRICS_PASSWORD=' vps-upload/.env > "$tmp" || true
            printf 'METRICS_PASSWORD=%s\n' "$METRICS_PASSWORD" >> "$tmp"
            mv "$tmp" vps-upload/.env
          fi
          chmod 600 vps-upload/.env

      - name: Copy files and restart container
        run: |
          set -euo pipefail
          if [ "$DESTINATION" = prod ]; then
            HOST="$PROD_CMP_SERVER_HOST"
            USER="$PROD_CMP_SERVER_USER"
            KEY_BODY="$PROD_CMP_SERVER_SSH_KEY"
          else
            HOST="$DEV_CMP_SERVER_HOST"
            USER="$DEV_CMP_SERVER_USER"
            KEY_BODY="$DEV_CMP_SERVER_SSH_KEY"
          fi
          : "${HOST:?}"
          : "${USER:?}"
          : "${KEY_BODY:?}"
          KEY="$RUNNER_TEMP/vps_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$KEY_BODY" > "$KEY"
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" mkdir -p /opt/speaking-coach
          scp "${SSH_OPTS[@]}" \
            vps-upload/server-all.jar \
            vps-upload/Dockerfile.runtime \
            vps-upload/deploy-remote.sh \
            vps-upload/deploy-postgres.sh \
            vps-upload/.env \
            "${USER}@${HOST}:/opt/speaking-coach/"
          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
            bash /opt/speaking-coach/deploy-remote.sh
          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" 'bash -s' << 'EOF'
          set -euo pipefail
          echo "container=$(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' speaking-coach 2>/dev/null || echo missing)"
          port=$(grep -E '^SERVER_PORT=' /opt/speaking-coach/.env | head -1 | cut -d= -f2- | tr -d '\r')
          if grep -q '^METRICS_PASSWORD=.' /opt/speaking-coach/.env; then
            echo "password_line=present"
          else
            echo "password_line=missing"
          fi
          code=$(curl -sk -o /tmp/metrics.html -w '%{http_code}' "https://127.0.0.1:${port}/admin/metrics" || echo curlfail)
          echo "local_metrics=$code port=$port"
          head -c 180 /tmp/metrics.html | tr '\n' ' '
          echo
          EOF
          mkdir -p probe-out
          printf '%s\n' "$HOST" > probe-out/host.txt

      - name: Upload host for this deploy
        uses: actions/upload-artifact@v6
        with:
          name: ktor-host
          path: probe-out/host.txt
          retention-days: 1
