name: Redeploy PROD

on:
  workflow_dispatch:
    inputs:
      cmp_server:
        description: cmp-server
        type: boolean
        default: true
      ai_server:
        description: ai-server
        type: boolean
        default: true
      announcement:
        description: Vocabulary Builder announcement (no deployment)
        type: choice
        options: [none, preview, send, status, restore_keyboard, activity, activity_users]
        default: none

permissions:
  contents: read

jobs:
  require-target:
    name: Require a host
    runs-on: ubuntu-latest
    steps:
      - name: Fail if both hosts off
        if: ${{ inputs.cmp_server != true && inputs.ai_server != true && inputs.announcement == 'none' }}
        run: |
          echo "Enable cmp-server and/or ai-server" >&2
          exit 1

  package-server:
    name: Package cmp-server
    needs: require-target
    if: ${{ inputs.cmp_server }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CMP
        uses: ./.github/actions/setup-cmp

      - name: Test
        run: ./gradlew :server:test

      - name: Package
        run: ./gradlew :server:buildFatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: server-all
          path: cmp/server/build/libs/server-all.jar
          if-no-files-found: error
          retention-days: 1

  package-ai:
    name: Package ai-server
    needs: require-target
    if: ${{ inputs.ai_server }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Stage runtime
        run: |
          STAGE="$RUNNER_TEMP/ai-service-runtime"
          mkdir -p "$STAGE"
          cp Dockerfile requirements.txt "$STAGE/"
          cp -R app "$STAGE/app"

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: ai-service
          path: ${{ runner.temp }}/ai-service-runtime
          if-no-files-found: error
          retention-days: 1

  deploy-server:
    name: Deploy cmp-server
    needs:
      - require-target
      - package-server
    if: ${{ !cancelled() && inputs.cmp_server && needs.package-server.result == 'success' }}
    uses: ./.github/workflows/deploy-cmp-server.yml
    with:
      destination: prod
    secrets: inherit

  deploy-ai:
    name: Deploy ai-server
    needs:
      - require-target
      - package-ai
    if: ${{ !cancelled() && inputs.ai_server && needs.package-ai.result == 'success' }}
    uses: ./.github/workflows/deploy-ai-server.yml
    with:
      destination: prod
    secrets: inherit

  vocabulary-announcement:
    name: Vocabulary Builder announcement
    if: ${{ inputs.announcement == 'preview' || inputs.announcement == 'send' || inputs.announcement == 'status' || inputs.announcement == 'restore_keyboard' || inputs.announcement == 'activity' || inputs.announcement == 'activity_users' }}
    runs-on: ubuntu-latest
    environment: deploy-prod
    concurrency:
      group: prod-vocabulary-announcement
      cancel-in-progress: false
    env:
      AI_HOST: ${{ secrets.PROD_AI_SERVER_HOST }}
      AI_USER: ${{ secrets.PROD_AI_SERVER_USER }}
      AI_KEY: ${{ secrets.PROD_AI_SERVER_SSH_KEY }}
      CMP_HOST: ${{ secrets.PROD_CMP_SERVER_HOST }}
      CMP_USER: ${{ secrets.PROD_CMP_SERVER_USER }}
      CMP_KEY: ${{ secrets.PROD_CMP_SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Find users with completed onboarding
        if: ${{ inputs.announcement == 'preview' || inputs.announcement == 'send' }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/ai_key"
          printf '%s\n' "$AI_KEY" > "$RUNNER_TEMP/ai_key"
          ssh -i "$RUNNER_TEMP/ai_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$AI_USER@$AI_HOST" 'docker exec -i ai-service python -' \
            < infra/campaigns/vocabulary_builder_audience.py > "$RUNNER_TEMP/audience.txt"
          count=$(wc -l < "$RUNNER_TEMP/audience.txt")
          echo "Eligible users: $count"
          test "$count" -gt 0
      - name: Prepare sender
        if: ${{ inputs.announcement == 'send' || inputs.announcement == 'status' || inputs.announcement == 'restore_keyboard' }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/cmp_key"
          printf '%s\n' "$CMP_KEY" > "$RUNNER_TEMP/cmp_key"
          scp -i "$RUNNER_TEMP/cmp_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            infra/campaigns/vocabulary_builder_send.py \
            "$CMP_USER@$CMP_HOST:/tmp/vocabulary_builder_send.py"
      - name: Send announcement
        if: ${{ inputs.announcement == 'send' }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/cmp_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$CMP_USER@$CMP_HOST" 'python3 /tmp/vocabulary_builder_send.py' \
            < "$RUNNER_TEMP/audience.txt"
      - name: Inspect delivery
        if: ${{ inputs.announcement == 'status' }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/cmp_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$CMP_USER@$CMP_HOST" 'python3 /tmp/vocabulary_builder_send.py --status'
      - name: Restore reply keyboard
        if: ${{ inputs.announcement == 'restore_keyboard' }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/cmp_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$CMP_USER@$CMP_HOST" 'python3 /tmp/vocabulary_builder_send.py --restore-keyboard'
      - name: Read activity after announcement
        if: ${{ inputs.announcement == 'activity' || inputs.announcement == 'activity_users' }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/cmp_key"
          printf '%s\n' "$CMP_KEY" > "$RUNNER_TEMP/cmp_key"
          scp -i "$RUNNER_TEMP/cmp_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            infra/campaigns/vocabulary_builder_activity.py \
            "$CMP_USER@$CMP_HOST:/tmp/vocabulary_builder_activity.py"
          if [[ "${{ inputs.announcement }}" == 'activity_users' ]]; then
            remote_command='python3 /tmp/vocabulary_builder_activity.py --users'
          else
            remote_command='python3 /tmp/vocabulary_builder_activity.py'
          fi
          ssh -i "$RUNNER_TEMP/cmp_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$CMP_USER@$CMP_HOST" "$remote_command"
          ssh -i "$RUNNER_TEMP/cmp_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$CMP_USER@$CMP_HOST" 'rm -f /tmp/vocabulary_builder_activity.py'
      - name: Remove sender
        if: ${{ always() && (inputs.announcement == 'send' || inputs.announcement == 'status' || inputs.announcement == 'restore_keyboard') }}
        run: |
          ssh -i "$RUNNER_TEMP/cmp_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$CMP_USER@$CMP_HOST" 'rm -f /tmp/vocabulary_builder_send.py'
