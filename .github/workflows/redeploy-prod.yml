name: Redeploy PROD
run-name: PROD release ${{ inputs.release_run_id }}

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful main build run ID with a matching DEV rollout
        type: string
        required: true
      components:
        description: all or a comma-separated list of ktor, ai
        type: string
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  group: speaky-deploy-prod
  queue: max

jobs:
  deploy:
    uses: ./.github/workflows/deploy-release.yml
    with:
      destination: prod
      release_run_id: ${{ inputs.release_run_id }}
      components: ${{ inputs.components }}
