name: Redeploy PROD

on:
  workflow_dispatch:
    inputs:
      cmp_server:
        description: cmp-server
        type: boolean
        default: true
      ai_server:
        description: ai-server
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  require-target:
    name: Require a host
    runs-on: ubuntu-latest
    steps:
      - name: Fail if both hosts off
        if: ${{ inputs.cmp_server != true && inputs.ai_server != true }}
        run: |
          echo "Enable cmp-server and/or ai-server" >&2
          exit 1

  package-server:
    name: Package cmp-server
    needs: require-target
    if: ${{ inputs.cmp_server }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CMP
        uses: ./.github/actions/setup-cmp

      - name: Test
        run: ./gradlew :server:test

      - name: Package
        run: ./gradlew :server:buildFatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: server-all
          path: cmp/server/build/libs/server-all.jar
          if-no-files-found: error
          retention-days: 1

  package-ai:
    name: Package ai-server
    needs: require-target
    if: ${{ inputs.ai_server }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Stage runtime
        run: |
          STAGE="$RUNNER_TEMP/ai-service-runtime"
          mkdir -p "$STAGE"
          cp Dockerfile requirements.txt "$STAGE/"
          cp -R app "$STAGE/app"

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: ai-service
          path: ${{ runner.temp }}/ai-service-runtime
          if-no-files-found: error
          retention-days: 1

  deploy-server:
    name: Deploy cmp-server
    needs:
      - require-target
      - package-server
    if: ${{ !cancelled() && inputs.cmp_server && needs.package-server.result == 'success' }}
    uses: ./.github/workflows/deploy-cmp-server.yml
    with:
      destination: prod
    secrets: inherit

  deploy-ai:
    name: Deploy ai-server
    needs:
      - require-target
      - package-ai
    if: ${{ !cancelled() && inputs.ai_server && needs.package-ai.result == 'success' }}
    uses: ./.github/workflows/deploy-ai-server.yml
    with:
      destination: prod
    secrets: inherit

  reset-funnel-user:
    name: Reset one funnel user
    runs-on: ubuntu-latest
    environment: deploy-prod
    env:
      HOST: ${{ secrets.PROD_AI_SERVER_HOST }}
      USER: ${{ secrets.PROD_AI_SERVER_USER }}
      KEY_BODY: ${{ secrets.PROD_AI_SERVER_SSH_KEY }}
    steps:
      - name: Clear today's only funnel user
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/vps_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$KEY_BODY" > "$KEY"
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" 'bash -s' << 'EOF'
          set -euo pipefail
          python3 - << 'PY'
          import subprocess

          def redis(*args):
              out = subprocess.check_output(["docker", "exec", "redis", "redis-cli", "--raw", *args], text=True)
              return [line for line in out.splitlines() if line != ""]

          names = ("start_day", "activated_day", "engaged_day", "last_return_day", "source")
          fields = ("start", "activated", "engaged", "returned")
          day_fields = {
              "start": "start_day",
              "activated": "activated_day",
              "engaged": "engaged_day",
              "returned": "last_return_day",
          }
          day = "2026-09-24"

          def hget(key, field):
              raw = redis("HGET", key, field)
              return raw[0] if raw else ""

          owned = {field: 0 for field in fields}
          for key in redis("KEYS", "metrics:funnel:user:*"):
              record = {name: hget(key, name) for name in names}
              print("remaining", {name: value for name, value in record.items() if value})
              for field, day_field in day_fields.items():
                  if record[day_field] == day:
                      owned[field] += 1
          current = {field: int(hget(f"metrics:funnel:{day}", field) or 0) for field in fields}
          print("day_before", current, "owned_by_others", owned)
          for field in fields:
              extra = current[field] - owned[field]
              if extra <= 0:
                  continue
              redis("HINCRBY", f"metrics:funnel:{day}", field, str(-extra))
              src_key = f"metrics:funnel:{day}:src:direct"
              src_value = int(hget(src_key, field) or 0)
              if src_value >= extra:
                  redis("HINCRBY", src_key, field, str(-extra))
              print("decremented", field, extra)
          print("day_after", {field: hget(f"metrics:funnel:{day}", field) for field in fields})
          PY
          EOF
