name: Redeploy PROD

on:
  workflow_dispatch:
    inputs:
      cmp_server:
        description: cmp-server
        type: boolean
        default: true
      ai_server:
        description: ai-server
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  require-target:
    name: Require a host
    runs-on: ubuntu-latest
    steps:
      - name: Fail if both hosts off
        if: ${{ inputs.cmp_server != true && inputs.ai_server != true }}
        run: |
          echo "Enable cmp-server and/or ai-server" >&2
          exit 1

  package-server:
    name: Package cmp-server
    needs: require-target
    if: ${{ inputs.cmp_server }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CMP
        uses: ./.github/actions/setup-cmp

      - name: Test
        run: ./gradlew :server:test

      - name: Package
        run: ./gradlew :server:buildFatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: server-all
          path: cmp/server/build/libs/server-all.jar
          if-no-files-found: error
          retention-days: 1

  package-ai:
    name: Package ai-server
    needs: require-target
    if: ${{ inputs.ai_server }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Stage runtime
        run: |
          STAGE="$RUNNER_TEMP/ai-service-runtime"
          mkdir -p "$STAGE"
          cp Dockerfile requirements.txt "$STAGE/"
          cp -R app "$STAGE/app"

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: ai-service
          path: ${{ runner.temp }}/ai-service-runtime
          if-no-files-found: error
          retention-days: 1

  deploy-server:
    name: Deploy cmp-server
    needs:
      - require-target
      - package-server
    if: ${{ !cancelled() && inputs.cmp_server && needs.package-server.result == 'success' }}
    uses: ./.github/workflows/deploy-cmp-server.yml
    with:
      destination: prod
    secrets: inherit

  probe-webhook:
    name: Probe webhook status
    runs-on: ubuntu-latest
    environment: deploy-prod
    env:
      HOST: ${{ secrets.PROD_CMP_SERVER_HOST }}
      USER: ${{ secrets.PROD_CMP_SERVER_USER }}
      KEY_BODY: ${{ secrets.PROD_CMP_SERVER_SSH_KEY }}
    steps:
      - name: Ask Telegram for the last webhook error
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/vps_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$KEY_BODY" > "$KEY"
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" 'bash -s' << 'EOF'
          set -euo pipefail
          token=$(grep -E '^TELEGRAM_BOT_TOKEN=' /opt/speaking-coach/.env | head -1 | cut -d= -f2- | tr -d '\r')
          curl -s --max-time 20 -o /tmp/wh.json "https://api.telegram.org/bot${token}/getWebhookInfo"
          unset token
          python3 - << 'PY'
          import json
          from datetime import datetime, timezone
          data = json.load(open("/tmp/wh.json"))
          result = data.get("result") or {}
          url = result.get("url") or ""
          stamp = result.get("last_error_date")
          when = ""
          if stamp:
              when = datetime.fromtimestamp(stamp, timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          print("ok", data.get("ok"))
          print("has_url", bool(url))
          print("has_custom_certificate", result.get("has_custom_certificate"))
          print("pending_update_count", result.get("pending_update_count"))
          print("last_error_date", when or None)
          print("last_error_message", result.get("last_error_message"))
          print("max_connections", result.get("max_connections"))
          PY
          rm -f /tmp/wh.json
          EOF

  deploy-ai:
    name: Deploy ai-server
    needs:
      - require-target
      - package-ai
    if: ${{ !cancelled() && inputs.ai_server && needs.package-ai.result == 'success' }}
    uses: ./.github/workflows/deploy-ai-server.yml
    with:
      destination: prod
    secrets: inherit
