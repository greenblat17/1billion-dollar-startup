name: AI service

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'ai-service/**'
      - 'infra/ai-service/**'
      - 'infra/redis/**'
      - '.github/workflows/ai-service.yml'
  pull_request:
    paths:
      - 'ai-service/**'
      - 'infra/ai-service/**'
      - 'infra/redis/**'
      - '.github/workflows/ai-service.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Check personal memory with DEV model
        if: github.event_name == 'workflow_dispatch'
        env:
          DEV_AI_SERVER_ENV: ${{ secrets.DEV_AI_SERVER_ENV }}
        run: |
          python - <<'PY'
          import asyncio
          import os

          wanted = {"OPENAI_API_KEY", "OPENAI_BASE_URL", "LLM_MODEL"}
          for line in os.environ.pop("DEV_AI_SERVER_ENV", "").splitlines():
              key, separator, value = line.partition("=")
              key = key.strip()
              if separator and key in wanted:
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
                      value = value[1:-1]
                  os.environ[key] = value

          if not os.environ.get("OPENAI_API_KEY"):
              raise SystemExit("DEV model configuration is unavailable")

          from evals.check_person_memory import main

          try:
              asyncio.run(main())
          except Exception as error:
              reason = getattr(error, "reason", "")
              status = getattr(error, "status_code", "")
              print(f"personal memory check failed: {type(error).__name__} reason={reason} status={status}")
              raise SystemExit(1)
          PY

      - name: Stage runtime
        run: |
          STAGE="$RUNNER_TEMP/ai-service-runtime"
          mkdir -p "$STAGE"
          cp Dockerfile requirements.txt "$STAGE/"
          cp -R app "$STAGE/app"

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: ai-service
          path: ${{ runner.temp }}/ai-service-runtime
          if-no-files-found: error
          retention-days: 1
