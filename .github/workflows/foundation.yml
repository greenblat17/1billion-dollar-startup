name: Foundation integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cmp/server/**'
      - 'ai-service/**'
      - 'scripts/test-foundation.sh'
      - '.github/workflows/foundation.yml'
  push:
    branches: [main, master]
    paths:
      - 'cmp/server/**'
      - 'ai-service/**'
      - 'scripts/test-foundation.sh'
      - '.github/workflows/foundation.yml'
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foundation_test
          POSTGRES_USER: foundation_test
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foundation_test -d foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/foundation_test?user=foundation_test&password=local_test_only
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-cmp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ai-service/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: scripts/test-foundation.sh
      - name: Start isolated migration source after Redis-free runtime checks
        run: docker run -d --rm --name foundation-import-redis -p 127.0.0.1:56379:6379 redis:7.2-alpine
      - name: TutorStore migration rehearsal
        run: scripts/test-foundation.sh
        env:
          FOUNDATION_TEST_SUITE: migration
          SP00_IMPORT_REDIS_URL: redis://127.0.0.1:56379/0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: foundation-integration-tests
          path: cmp/server/build/reports/tests/foundationIntegrationTest
          if-no-files-found: error
