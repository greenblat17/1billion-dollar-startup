name: TutorStore migration rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    name: Check Redis to PostgreSQL import
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foundation_test
          POSTGRES_USER: foundation_test
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foundation_test -d foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/foundation_test?user=foundation_test&password=local_test_only
      SP00_IMPORT_REDIS_URL: redis://127.0.0.1:56379/0
      FOUNDATION_TEST_SUITE: migration
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cmp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ai-service/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: scripts/test-foundation.sh
