name: Mini App checks
on:
  pull_request:
    paths: ['mini-app/**', 'infra/miniapp/**', '.github/workflows/*mini-app*']
  push:
    paths: ['mini-app/**', 'infra/miniapp/**', '.github/workflows/*mini-app*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check edge migration
        run: python3 -m unittest discover -s infra/miniapp -p "test_*.py"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test && npm run build
        working-directory: mini-app
      - name: Verify static server
        run: |
          docker build -t mini-app-test mini-app
          docker run -d --name mini-app-test -p 127.0.0.1:8088:8080 mini-app-test
          trap 'docker rm -f mini-app-test' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 -fsS http://127.0.0.1:8088/miniapp > /dev/null
          curl -fsS http://127.0.0.1:8088/miniapp/assets/app.js > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/miniapp/voice)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/miniapp/assets/missing.js)" = 404
