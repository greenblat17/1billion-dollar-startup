name: Deploy ai-server

on:
  workflow_call:
    inputs:
      destination:
        description: prod or dev
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ai-server (${{ inputs.destination }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination == 'prod' && 'deploy-prod' || 'deploy-dev' }}
    concurrency:
      group: ai-${{ inputs.destination }}
      cancel-in-progress: false
    env:
      DESTINATION: ${{ inputs.destination }}
      PROD_AI_SERVER_HOST: ${{ secrets.PROD_AI_SERVER_HOST }}
      PROD_AI_SERVER_USER: ${{ secrets.PROD_AI_SERVER_USER }}
      PROD_AI_SERVER_SSH_KEY: ${{ secrets.PROD_AI_SERVER_SSH_KEY }}
      PROD_AI_SERVER_ENV: ${{ secrets.PROD_AI_SERVER_ENV }}
      DEV_AI_SERVER_HOST: ${{ secrets.DEV_AI_SERVER_HOST }}
      DEV_AI_SERVER_USER: ${{ secrets.DEV_AI_SERVER_USER }}
      DEV_AI_SERVER_SSH_KEY: ${{ secrets.DEV_AI_SERVER_SSH_KEY }}
      DEV_AI_SERVER_ENV: ${{ secrets.DEV_AI_SERVER_ENV }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download runtime
        uses: actions/download-artifact@v7
        with:
          name: ai-service
          path: vps-upload

      - name: Stage runtime files
        run: |
          set -euo pipefail
          cp infra/ai-service/deploy-remote.sh vps-upload/deploy-remote.sh
          cp infra/ai-service/ai-service-port.sh vps-upload/ai-service-port.sh
          cp infra/ai-service/restrict-8090.sh vps-upload/restrict-8090.sh
          cp infra/ai-service/restrict-8090.service vps-upload/restrict-8090.service
          cp infra/redis/deploy-remote.sh vps-upload/deploy-redis.sh
          chmod +x vps-upload/deploy-remote.sh vps-upload/deploy-redis.sh vps-upload/restrict-8090.sh
          umask 077
          if [ "$DESTINATION" = prod ]; then
            ENV_BODY="${PROD_AI_SERVER_ENV:-}"
            ENV_NAME=PROD_AI_SERVER_ENV
          else
            ENV_BODY="${DEV_AI_SERVER_ENV:-}"
            ENV_NAME=DEV_AI_SERVER_ENV
          fi
          if [ -z "$ENV_BODY" ]; then
            echo "$ENV_NAME is empty" >&2
            exit 1
          fi
          printf '%s\n' "$ENV_BODY" > vps-upload/.env
          chmod 600 vps-upload/.env

      - name: Copy files and restart container
        run: |
          set -euo pipefail
          if [ "$DESTINATION" = prod ]; then
            HOST="$PROD_AI_SERVER_HOST"
            USER="$PROD_AI_SERVER_USER"
            KEY_BODY="$PROD_AI_SERVER_SSH_KEY"
          else
            HOST="$DEV_AI_SERVER_HOST"
            USER="$DEV_AI_SERVER_USER"
            KEY_BODY="$DEV_AI_SERVER_SSH_KEY"
          fi
          : "${HOST:?}"
          : "${USER:?}"
          : "${KEY_BODY:?}"
          KEY="$RUNNER_TEMP/vps_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$KEY_BODY" > "$KEY"
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" mkdir -p /opt/ai-service
          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
            rm -rf /opt/ai-service/app /opt/ai-service/main.py /opt/ai-service/greeting.ogg
          scp "${SSH_OPTS[@]}" \
            vps-upload/Dockerfile \
            vps-upload/requirements.txt \
            vps-upload/deploy-remote.sh \
            vps-upload/deploy-redis.sh \
            vps-upload/restrict-8090.sh \
            vps-upload/restrict-8090.service \
            vps-upload/ai-service-port.sh \
            vps-upload/.env \
            "${USER}@${HOST}:/opt/ai-service/"
          scp -r "${SSH_OPTS[@]}" \
            vps-upload/app \
            "${USER}@${HOST}:/opt/ai-service/app"
          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
            bash /opt/ai-service/deploy-redis.sh
          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
            bash /opt/ai-service/deploy-remote.sh
