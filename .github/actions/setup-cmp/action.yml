name: Set up Ktor build
description: Zulu JDK 21 and Gradle for Ktor and core

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: true

    - name: Use faster Gradle settings on CI
      shell: bash
      run: |
        gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$gradle_home"
        cat >> "$gradle_home/gradle.properties" <<'EOF'
        org.gradle.parallel=true
        org.gradle.workers.max=4
        org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        kotlin.daemon.jvmargs=-Xmx3g
        EOF
