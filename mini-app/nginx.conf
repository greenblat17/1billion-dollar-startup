server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    # Stable asset URLs: always revalidate after independent UI deployments.
    add_header Cache-Control "no-cache" always;
    location = /health { access_log off; return 200 "ok\n"; }
    location = /miniapp { try_files /miniapp/index.html =404; }
    location = /miniapp/ { try_files /miniapp/index.html =404; }
    location = /version.json { try_files $uri =404; }
    location /miniapp/assets/ { try_files $uri =404; }
    # API/WebSocket are routed to AI by the HTTPS edge, never served as HTML.
    location / { return 404; }
}
