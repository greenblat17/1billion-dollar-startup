<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>Speaky — Саша</title><link rel="stylesheet" href="/miniapp/assets/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><main id="call" hidden><div id="timer" aria-label="Время звонка">00:00</div><div class="identity"><img src="/miniapp/assets/avatar.jpg" alt="Саша, ваш репетитор"><h1>Саша</h1></div><div id="notice" role="status" hidden></div><p id="mic-status" role="status">Подключаем микрофон…</p><div class="controls"><button id="mute" disabled aria-label="Выключить микрофон" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path class="mic-slash" d="M3 3L21 21"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><span id="mic-action">Выключить</span></button><button id="end" aria-label="Завершить звонок"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16v-4c5-5 13-5 18 0v4l-5-1v-3a13 13 0 0 0-8 0v3z"/></svg><span>Завершить</span></button></div></main>
<section id="progress" hidden aria-labelledby="progress-title"><div class="progress-shell"><header>speaky<span>.</span></header><p class="eyebrow">ВАШ ПУТЬ С САШЕЙ</p><h1 id="progress-title">Мой прогресс</h1><div id="progress-state" role="status" aria-live="polite"></div><div id="progress-content" hidden><section class="goal-card"><p class="eyebrow">ВАША ЦЕЛЬ</p><h2 id="progress-goal"></h2></section><p id="progress-note" class="progress-note"></p><ol id="progress-steps" aria-label="Этапы вашего пути"></ol></div><button id="progress-refresh">Обновить</button><button id="progress-back">Вернуться к Саше</button><p class="progress-footer">Маршрут меняется вместе с вами. Достижения опираются на практику, а не на число уроков.</p></div></section>
<section id="lobby" hidden><header>speaky<span>.</span></header><h1>Ваши встречи</h1><p>Договориться о времени можно с Сашей в Telegram.</p><div id="meetings"></div><div id="schedules"></div><button id="back">Вернуться в Telegram</button></section>
<section id="error" hidden role="alert"><h1 id="error-title">Не удалось подключиться</h1><p id="error-text"></p><button id="retry">Попробовать снова</button><button id="return">Вернуться в Telegram</button></section>
<script type="module" src="/miniapp/assets/app.js"></script></body></html>
