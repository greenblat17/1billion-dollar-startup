name: speaky-storage
services:
  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    container_name: speaky-storage
    entrypoint: [weed]
    command:
      - server
      - -dir=/data/volumes
      - -master.dir=/data/master
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.telemetry=false
      - -master.volumeSizeLimitMB=1024
      - -volume.max=16
      - -volume.minFreeSpace=5GiB
      - -filer
      - -s3
      - -s3.ip.bind=0.0.0.0
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.autoCreateBucket=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.readerCacheSizeMB=32
      - -s3.concurrentUploadLimitMB=32
    working_dir: /data
    environment:
      GOMEMLIMIT: 384MiB
    volumes:
      - ./data:/data
      - ./secrets/s3.json:/etc/seaweedfs/s3.json:ro
      - ./filer.toml:/etc/seaweedfs/filer.toml:ro
      - ./master.toml:/etc/seaweedfs/master.toml:ro
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, 'nc -z 127.0.0.1 8333 && wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
networks:
  storage:
    name: speaky-storage
    internal: true
