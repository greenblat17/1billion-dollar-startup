services:
  ai-service-stub:
    build: ./ai-service-stub
    ports:
      - "8090:8090"

  server:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      AI_SERVICE_BASE_URL: http://ai-service-stub:8090
    depends_on:
      - ai-service-stub
